name: deploy-production

# Builds the Sinha Academy Next.js site, pushes it to Docker Hub, and redeploys the `web`
# service of the `sinhaacademy` stack on the shared quizwrap.com server.
# See deploy/MIGRATION-quizwrap.md.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - "types.d.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy without building (e.g. prod-<sha> to roll back). Leave empty to build HEAD."
        required: false
        default: ""

concurrency:
  group: sinhaacademy-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ inputs.tag || 'prod' }}
    steps:
      # Fail before building or touching the server if any secret is missing.
      - name: Check required secrets
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in DOCKER_USERNAME DOCKER_PASSWORD SERVER_HOST SERVER_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.tag }}

      - uses: docker/login-action@v3
        if: ${{ !inputs.tag }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push sinhaacademy
        if: ${{ !inputs.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/sinhaacademy:prod
            ${{ env.DOCKER_USERNAME }}/sinhaacademy:prod-${{ github.sha }}
          cache-from: type=gha,scope=sinhaacademy
          cache-to: type=gha,mode=max,scope=sinhaacademy

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.prod.yml
          target: sinhaacademy
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG
          script: |
            set -e
            cd ~/sinhaacademy
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose -f docker-compose.prod.yml pull web
            # Recreate only this service; never `down`, other products share this host.
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate web
            # Images only: never prune volumes or networks on the shared host.
            docker image prune -f

            # Poll instead of `up --wait`, which reports unhealthy during start_period.
            for i in $(seq 1 36); do
              web=$(docker inspect -f '{{.State.Health.Status}}' sinhaacademy-web)
              echo "attempt $i: web=$web"
              if [ "$web" = healthy ]; then
                echo "sinhaacademy deployed ($IMAGE_TAG)"
                exit 0
              fi
              sleep 10
            done
            echo "sinhaacademy-web did not become healthy within 6 minutes"
            docker compose -f docker-compose.prod.yml ps
            docker logs --tail 100 sinhaacademy-web
            exit 1
